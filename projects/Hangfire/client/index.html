<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hangfire — Lobby</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main>
<h1>Hangfire <small>Lobby / Room / Team</small></h1>
<section id="login"><h2>Guest Login</h2><form id="login-form"><label>Display name <input id="display-name" maxlength="32" required></label><button>Enter Lobby</button></form></section>
<section id="lobby" hidden><p id="identity"></p><div class="panels"><section><h2>Lobby</h2><label>Team mode <select id="mode"><option>1v1</option><option>2v2</option><option>3v3</option><option>4v4</option></select></label><button id="create">Create Room</button><label>Invite code <input id="invite-code" maxlength="6"></label><button id="join">Join Room</button><div id="rooms"></div></section><section><h2>Lobby Chat</h2><div class="chat" id="lobby-chat"></div><div class="chat-controls"><select id="lobby-channel"><option>LOBBY</option><option>WHISPER</option></select><select id="lobby-target" hidden></select><input id="lobby-text" maxlength="500"><button id="lobby-send">Send</button></div></section></div></section>
<section id="room" hidden><h2>Room <span id="room-code"></span></h2><p id="room-status"></p><div id="room-players"></div><button id="start">Start Battle</button><button id="leave">Leave Room</button><div class="chat" id="room-chat"></div><div class="chat-controls"><select id="room-channel"><option>ROOM</option><option>WHISPER</option></select><select id="room-target" hidden></select><input id="room-text" maxlength="500"><button id="room-send">Send</button></div></section>
<section id="battle" hidden><div id="battle-overlay"></div><div class="chat-controls"><select id="battle-channel"><option>BATTLE_GLOBAL</option><option>BATTLE_TEAM</option><option>WHISPER</option></select><select id="battle-target" hidden></select><input id="battle-text" maxlength="500"><button id="battle-send">Send</button><button id="battle-side">Switch side</button></div><p class="note">Battle chat is server-routed. Opponent Team messages are never sent to this client.</p></section>
<p id="status" role="status"></p>
</main></body></html>
