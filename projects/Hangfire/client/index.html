<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hangfire — Layer 1 Playground</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
<main>
  <h1>Hangfire <small>Layer 1 / 弾道と風</small></h1>
  <p>Serverが弾道と着弾を決定します。風はServer起動時の設定です。</p>
  <form id="controls">
    <label>Angle (°) <input id="angle" name="angle" type="number" step="any" required disabled></label>
    <label>Power <input id="power" name="power" type="number" step="any" required disabled></label>
    <button id="fire" disabled>Fire / 発射</button>
  </form>
  <p id="wind">Wind: 接続中</p>
  <p id="status" role="status">Serverへ接続しています…</p>
  <canvas id="field" width="1000" height="480" aria-label="Serverから受信した弾道と平地"></canvas>
  <p id="impact">着弾: 未発射</p>
  <p class="note">座標: 右が +X、上が +Y。画面は受信した軌道全体に合わせて表示します。</p>
</main>
</body>
</html>
