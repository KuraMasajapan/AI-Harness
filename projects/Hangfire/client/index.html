<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangfire — Layer 4 Playground</title>
<link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head>
<body><main>
<h1>Hangfire <small>Layer 4 / 操作と20秒制限</small></h1>
<p>A / D 長押しで移動、↑ / ↓ 長押しでAim。Gearを左ドラッグして直接Aim。</p>
<p>Space長押しで充電、離すと発射。5秒でMAX自動発射。20秒前に始めた充電だけは延長できます。</p>
<p id="match">接続中</p><p id="turn"></p>
<label>Power <progress id="power" value="0" max="100"></progress></label><p id="readout"></p>
<p id="health"></p><p id="hit-result"></p>
<table><thead><tr><th>Player</th><th>X</th><th>Resource</th><th>nextActionTime</th></tr></thead><tbody id="players"></tbody></table>
<p id="wind"></p><p id="status" role="status">Serverへ接続しています…</p>
<canvas id="field" width="1000" height="480" aria-label="Serverから受信した弾道と平地"></canvas>
<p id="impact"></p>
<label class="dev-control"><input id="dev-hit" type="checkbox">DEV / Tuning: Server確定値・設定・衝突を表示</label>
<pre id="dev-state" hidden></pre>
<p class="note">固定2人hotseat。Resource回復は未実装。再起動で初期化します。</p>
</main></body></html>
